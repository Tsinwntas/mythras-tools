<div class="roll-check-fields"><mat-form-field><mat-label>Skill level</mat-label><input matInput type="number" [(ngModel)]="skill"></mat-form-field><mat-form-field><mat-label>Augmenting skill</mat-label><input matInput type="number" [(ngModel)]="augment"></mat-form-field><mat-form-field><mat-label>Opposing skill (over 100)</mat-label><input matInput type="number" [(ngModel)]="opponent"></mat-form-field></div>
<div class="success-grades"><article *ngFor="let row of getTable()"><h3>{{row.level}} <span>{{getNormalValue(row.mod)}}%</span></h3><dl><div><dt>Success</dt><dd>{{getSuccess(row.mod)}} or less</dd></div><div><dt>Critical</dt><dd>{{getCrit(row.mod)}} or less</dd></div><div><dt>Failure</dt><dd>{{getFailure(row.mod)}}+</dd></div><div><dt>Fumble</dt><dd>{{getFumble(row.mod)}}+</dd></div></dl></article></div>
