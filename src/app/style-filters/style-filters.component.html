<div class="filters-wrap">
    <mat-form-field>
        <mat-label>Search by name or trait</mat-label>
        <input matInput [(ngModel)]="filters.name" (input)="filter.emit()">
    </mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label>Culture</mat-label>
      <mat-select [(value)]="filters.culture" (selectionChange)="filter.emit()">
        <mat-option>None</mat-option>
        <mat-option *ngFor="let culture of ['Barbarian', 'Civilized', 'Nomadic', 'Primitive']" [value]="culture">{{culture}}</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field>
        <mat-label>Source</mat-label>
        <mat-select placeholder="Source" multiple [(ngModel)]="filters.sources" (selectionChange)="filter.emit()">
            <input class="filter-option-search" aria-label="Search sources" placeholder="Search sources" [(ngModel)]="sourceFilter" (keydown)="$event.stopPropagation()"/>
            <button class="clear-weapons" mat-flat-button (click)="clearSources()">Clear Selections</button>
            <mat-option *ngFor="let source of getSources()" [value]="source" [ngStyle]="isHidden(sourceFilter, source)?{'display':'none'}:null">
                {{source}}
            </mat-option>
        </mat-select>
    </mat-form-field>
    <mat-form-field>
        <mat-label>Weapons</mat-label>
        <mat-select placeholder="Weapons" multiple [(ngModel)]="filters.weapons" (selectionChange)="filter.emit()">
          <input class="filter-option-search" aria-label="Search weapons" placeholder="Search weapons" [(ngModel)]="weaponFilter" (keydown)="$event.stopPropagation()"/>
          <button class="clear-weapons" mat-flat-button (click)="clearWeapons()">Clear Selections</button>
          <mat-optgroup *ngFor="let group of getWeaponGroups()" [label]="group.name">
            <mat-option *ngFor="let weapon of group.weapons" [value]="weapon" [ngStyle]="isHidden(weaponFilter, weapon)?{'display':'none'}:null">
              {{weapon}}
            </mat-option>
          </mat-optgroup>
        </mat-select>
    </mat-form-field>
    <mat-form-field>
        <mat-label>Special effects</mat-label>
        <mat-select placeholder="Special effects" multiple [(ngModel)]="filters.specials" (selectionChange)="filter.emit()">
          <input class="filter-option-search" aria-label="Search effects" placeholder="Search effects" [(ngModel)]="specialFilter" (keydown)="$event.stopPropagation()"/>
          <button class="clear-weapons" mat-flat-button (click)="clearSpecials()">Clear Selections</button>
          <mat-optgroup *ngFor="let group of getSpecialGroups()" [label]="group.name">
            <mat-option *ngFor="let special of group.specials" [value]="special" [ngStyle]="isHidden(specialFilter, special)?{'display':'none'}:null">
              {{special}}
            </mat-option>
          </mat-optgroup>
        </mat-select>
    </mat-form-field>
    <button mat-flat-button color="primary" (click)="filter.emit()">FILTER</button>
</div>
