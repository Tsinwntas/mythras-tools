<p>Choose a specialization, or create another for this skill. Point allocations are shown for reference.</p>
<div class="specialization-list"><article *ngFor="let row of getTable()">
<mat-form-field><mat-label>Specialization name</mat-label><input matInput [(ngModel)]="row.specialty" (ngModelChange)="setName(row.select,$event)"></mat-form-field>
<dl><div><dt>Culture</dt><dd>{{row.culture || 0}}</dd></div><div><dt>Career</dt><dd>{{row.career || 0}}</dd></div><div><dt>Bonus</dt><dd>{{row.extra || 0}}</dd></div></dl>
<div class="specialization-actions"><button mat-flat-button color="primary" (click)="select(row.select)">Select specialization</button><button *ngIf="row.remove" mat-stroked-button color="warn" (click)="remove(row.remove)">Delete specialization</button></div>
</article></div>
<button mat-stroked-button (click)="add()"><mat-icon>add</mat-icon> Add specialization</button>
