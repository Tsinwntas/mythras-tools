<section class="supplement" *ngIf="entries.length">
  <header>
    <p>
      MYTHRAS · CHARACTER DETAILS
    </p>
    <h1>
      {{character.name || 'Unnamed character'}}
    </h1>
    <p>
      Complete skills, magic, equipment and campaign notes. This supplement continues across as many printed pages as needed.
    </p>
  </header>
  <article *ngFor="let entry of entries">
    <h2>
      {{entry.heading}}
    </h2>
    <p>
      {{entry.text}}
    </p>
  </article>
</section>
