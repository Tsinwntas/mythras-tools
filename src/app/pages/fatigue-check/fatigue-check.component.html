<div class="reference-callout">Make an Endurance roll when a <open-modal modal="fatigue">fatigue check</open-modal> is due. A failed roll loses a Fatigue level.</div>
<section class="reference-panel"><h3>When to check</h3><p>Use the combatant's CON to find the interval between checks.</p>
<div class="fatigue-intervals"><article><span>CON 1–5</span><strong>Every 2nd round</strong></article><article><span>CON 6–10</span><strong>Every 3rd round</strong></article><article><span>CON 11–15</span><strong>Every 4th round</strong></article><article><span>CON 16–20</span><strong>Every 5th round</strong></article></div></section>
